<!DOCTYPE html>
<html lang="en" th:replace="~{baseFragment :: parent(~{::#content},~{::title}, ~{script})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" data-th-href="@{'/css/output.css'}">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
 
    
</head>
<body>
    <div id="content">
        <div class="grid grid-cols-4 mt-4">
            <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>
            <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
              <div class="block p-6 border-t-[10px] border-green-700 bg-white rounded-xl shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">

                <div data-th-replace = "message::messagebox"></div>
      
                </div>
      
                <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                  Login Here
                </h5>
                <p class="font-normal text-gray-700 dark:text-gray-400">
                  start managing your contacts on cloud
                </p>
                <div th:if="${param.error}">Invalid Username or password</div>
                <div th:if = "${param.logout}" > You have been logout</div>
                <form 
                method="post"
                data-th-action="@{'/authenticate'}"
                class="mt-5"
                    >

                  <!-- for Email -->
                  <div class="mb-3">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                    <input name="email" type="text" id="email"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                      placeholder="Johnson@gmail.com" required />
                      <!-- <p
                        
                        
                        class="text-red-600 px-1 py-2">User is required</p> -->
                  </div>
                  <!-- for Password -->
                  <div class="mb-3">
                    <label for="password"
                      class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                    <input name="password" type="password" id="password"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                      placeholder="ex. Tony@123" required />
                      <!-- <p class="text-red-600 px-1 py-2">password is required</p> -->
                  </div>
      
                  <!-- Buttons -->
                  <div class="mb-3 flex justify-center space-x-3">
                    <div class="mb-3 flex justify-center space-x-3">
                      <button type="submit"
                        class="px-3 py-2 rounded bg-gray-700 text-white dark:bg-blue-700 dark:hover:bg-blue-800 hover:bg-gray-900">Login</button>
                      <button type="reset"
                        class="px-3 py-2 rounded bg-gray-700 text-white dark:bg-blue-700 dark:hover:bg-blue-800 hover:bg-gray-900">Reset</button>
                    </div>
      
                </form>
              </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>

</body>
</html>
